<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Updates Atlas: map</title>
<meta name="description" content="A map of AI research links saved by David Jhave Johnston during postdoctoral work at the Center for Digital Narrative, University of Bergen. Links that share vocabulary sit together; a time strip shows when each area was active.">
<meta name="author" content="David Jhave Johnston">
<script>
  // Apply the saved theme before first paint. Shares the "theme" key with index.html and atlas.html.
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<style>
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --ink: #15181C; --muted: #59626D; --faint: #8C949E;
  --rule: #DCE0E5; --empty: #E1E5EA;
  --machines: #2856C2; --minds: #0B8574; --world: #A9640E; --art: #9E347D; --misc: #5C6A15; --other: #6E7781;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, "Iowan Old Style", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1A1D21; --surface: #22262B; --ink: #E6E9ED; --muted: #A4ACB6; --faint: #7A838E;
  --rule: #363B42; --empty: #30353C;
  --machines: #7FA3F3; --minds: #4DC5B2; --world: #E2A552; --art: #E07CC1; --misc: #B3C35B; --other: #9AA3AD;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font: 11px var(--sans); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg); }

/* ---------- frame ---------- */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--rule); background: var(--surface); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font: 600 18px/1.2 var(--sans); margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.brand h1 a { text-decoration: none; }
.brand .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { flex: 1 1 240px; max-width: 460px; margin-left: auto; position: relative; display: flex; align-items: center; }
.search input { width: 100%; padding: 7px 34px 7px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); outline: none; }
.search input:focus { border-color: var(--ink); }
.search .hint { position: absolute; right: 9px; color: var(--faint); pointer-events: none; }
.toplinks { display: flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg > * { padding: 4px 11px; font-size: 13px; text-decoration: none; color: var(--muted); background: var(--surface); border: 0; }
.seg > * + * { border-left: 1px solid var(--rule); }
.seg > [aria-current], .seg > [aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg > a:hover { color: var(--ink); }
.iconbtn { border: 1px solid transparent; background: none; padding: 5px 9px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.iconbtn:hover { border-color: var(--rule); color: var(--ink); }
.iconbtn svg { width: 16px; height: 16px; vertical-align: -3px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 31vw, 430px); min-height: 0; }
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; border-right: 1px solid var(--rule); }

/* ---------- map ---------- */
.mapwrap { position: relative; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
#map.point { cursor: pointer; }
.tip { position: absolute; z-index: 4; max-width: 300px; padding: 6px 9px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.35; pointer-events: none; transform: translate(-50%, -100%); margin-top: -12px; }
.tip small { display: block; opacity: .7; font-size: 11px; margin-top: 1px; }
.tip[hidden] { display: none; }
.legend { position: absolute; left: 12px; bottom: 10px; z-index: 3; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 24px); }
.legend button { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--muted); }
.legend button i { width: 8px; height: 8px; border-radius: 50%; }
.legend button:hover { color: var(--ink); }
.legend button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.zoom { position: absolute; right: 12px; top: 12px; z-index: 3; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
.zoom button { width: 30px; height: 30px; border: 0; background: none; color: var(--muted); font-size: 17px; line-height: 1; }
.zoom button + button { border-top: 1px solid var(--rule); }
.zoom button:hover { color: var(--ink); background: var(--bg); }
.zoom svg { width: 14px; height: 14px; vertical-align: -2px; }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
.status[hidden] { display: none; }

/* ---------- time strip ---------- */
.strip { border-top: 1px solid var(--rule); background: var(--surface); padding: 8px 14px 6px; }
.striphead { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; min-height: 24px; }
.striphead strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.striphead .sp { margin-left: auto; }
.pill { white-space: nowrap; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.pill:hover { color: var(--ink); border-color: var(--ink); }
#time { display: block; width: 100%; height: 58px; touch-action: none; cursor: crosshair; user-select: none; }
#time text { font: 10.5px var(--sans); fill: var(--faint); }
#time .tot { fill: var(--empty); }
#time .act { fill: var(--muted); }
#time .in { fill: var(--ink); }
#time .brush { fill: var(--ink); opacity: .08; }
#time .edge { stroke: var(--ink); stroke-width: 1; }

/* ---------- panel ---------- */
.panel { min-height: 0; overflow-y: auto; background: var(--surface); padding: 16px 20px 60px; }
.panel h2 { font: 400 22px/1.25 var(--serif); margin: 6px 0 8px; letter-spacing: -0.005em; }
.panel .lead { color: var(--muted); font-size: 13px; margin: 0 0 14px; max-width: 46ch; }
.panel h3 { font: 600 12.5px/1.3 var(--sans); margin: 22px 0 6px; padding-top: 14px; border-top: 1px solid var(--rule); }
.back { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; }
.back:hover { color: var(--ink); text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); color: var(--ink); }
.chip .x { color: var(--faint); font-size: 14px; line-height: 1; }
.chip:hover .x { color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.kicker { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.terms { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

.topics { list-style: none; margin: 0; padding: 0; }
.topics button { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 5px 0; border: 0; background: none; text-align: left; }
.topics svg { width: 54px; height: 18px; display: block; }
.topics .nm { font-family: var(--serif); font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topics .nm small { font-family: var(--sans); font-size: 12px; color: var(--faint); margin-left: 6px; }
.topics .n { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.topics button:hover .nm { text-decoration: underline; }
.topics button.zero { opacity: .4; }

.rows { list-style: none; margin: 0; padding: 0; }
.rows button { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 10px; width: 100%; padding: 6px 0; border: 0; background: none; text-align: left; align-items: baseline; }
.rows .d { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .t { font-family: var(--serif); font-size: 15px; line-height: 1.33; }
.rows .t b { font: 600 12.5px var(--sans); color: var(--muted); margin-right: 5px; }
.rows .m { grid-column: 2; color: var(--faint); font-size: 11.5px; }
.rows button:hover .t { text-decoration: underline; }
.rows button.seen .t { color: var(--muted); }
.more { margin-top: 10px; }

.open { display: inline-block; margin: 4px 0 14px; padding: 6px 12px; border: 1px solid var(--ink); border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 500; }
.open:hover { background: var(--ink); color: var(--surface); }
.body { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; overflow-wrap: anywhere; }
.body p { margin: 0 0 0.9em; }
.body .lede { font-size: 17px; }
.body p.short { margin-bottom: 0.35em; }
.body.clip { max-height: 24em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; }
.linkbtn:hover { color: var(--ink); }
.note { color: var(--muted); font-size: 13px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; color: var(--muted); margin: 0; }
.keys dd { margin: 0; }
.foot { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--faint); font-size: 12px; }
.foot a { color: var(--muted); }

/* ---------- narrow screens: map on top, panel below ---------- */
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .main { display: block; }
  .stage { display: block; border-right: 0; border-bottom: 1px solid var(--rule); }
  .legend { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; right: 12px; }
  .legend button { flex: none; }
  .striphead .hint2 { display: none; }
  .mapwrap { height: 46vh; min-height: 260px; }
  .top { padding: 10px 14px; gap: 10px; }
  .brand .sub, .search .hint { display: none; }
  .panel { padding: 14px 14px 60px; overflow: visible; }
  #time { height: 46px; }
}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand">
    <h1><a href="atlas_v4.html">AI Updates atlas</a></h1>
    <span class="sub" id="sub">Loading the archive</span>
  </div>
  <label class="search">
    <span class="sr-only">Search titles and full text</span>
    <input id="q" type="search" placeholder="Search titles and full text" autocomplete="off" spellcheck="false">
    <span class="hint"><kbd>/</kbd></span>
  </label>
  <nav class="toplinks">
    <div class="seg" role="group" aria-label="View">
      <span aria-current="page">Map</span><a href="atlas.html" title="Categories by week, with a reader">Ledger</a><a href="index.html" title="The chronological list with full descriptions">List</a>
    </div>
    <button class="iconbtn" id="theme" type="button" aria-label="Switch to dark mode"></button>
  </nav>
</header>

<div class="main">
  <div class="stage">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" role="img" aria-label="Map of the saved links. Each dot is a link; links with shared vocabulary sit together. The same topics are listed as buttons in the panel."></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="legend" id="legend" role="group" aria-label="Colour: category family. Select one to show only that family."></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
        <button type="button" id="zfit" aria-label="Show the whole map" title="Show the whole map"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
      </div>
      <div class="status" id="status">Loading the archive…</div>
    </div>
    <section class="strip" aria-label="Time">
      <div class="striphead">
        <span id="period"></span>
        <span class="sp"></span>
        <button class="pill" id="clearTime" type="button" hidden>All dates</button>
        <button class="pill" id="play" type="button" aria-pressed="false" title="Move an eight-week window through the archive">Play through time</button>
      </div>
      <svg id="time" role="img" aria-label="Links saved per week. Drag across the bars to choose a period."></svg>
    </section>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

</div>

<script>
'use strict';

/* =====================================================================
   CATEGORY MAPPING: same block as atlas.html. Edit both when tags change.
   Families give the dot colours. The topics on the map do NOT come from
   these tags: they are found from the words of the entries themselves.
   ===================================================================== */
const FAMILIES = [
  { key: 'machines', name: 'Machines', tags: ['Foundation-Models', 'Research-into-AI', 'Applied-AI', 'Tech', 'Robotics', 'Quantum', 'AR-VR'] },
  { key: 'minds', name: 'Minds and bodies', tags: ['Consciousness', 'BCI', 'Med'] },
  { key: 'world', name: 'World', tags: ['Governance', 'Economy', 'War', 'Ethics', 'Alignment', 'Edu', 'Ecology'] },
  { key: 'art', name: 'Art and narrative', tags: ['AI-Art-Research', 'Liferature', 'Watching'] },
  { key: 'misc', name: 'Misc', tags: ['Observations', 'Theory', 'Tangents'] },
];
const LABEL = {
  'Foundation-Models': 'Foundation models', 'Research-into-AI': 'Research into AI', 'Applied-AI': 'Applied AI',
  'AR-VR': 'AR / VR', 'BCI': 'Brain implants', 'Med': 'Medical', 'Edu': 'Education', 'AI-Art-Research': 'AI art research',
};
const ALIAS = {
  'ar': 'AR-VR', 'vr': 'AR-VR', 'xr': 'AR-VR', 'ar/vr': 'AR-VR', 'consciousnesses': 'Consciousness',
  'ehtics': 'Ethics', 'onservations': 'Observations', 'observation': 'Observations', 'literature': 'Liferature',
  'applied': 'Applied-AI', 'ap': 'Applied-AI', 'economy"': 'Economy',
};
const DROP = new Set(['xdn', 'ai']);
/* ---- end of category mapping ---- */
const UNSORTED = { key: 'other', name: 'Unsorted', tags: [] };
const NOCAT = 'No-category';
LABEL[NOCAT] = 'No category';
const TAG_FAMILY = {}; const CANON = {};
FAMILIES.forEach(f => f.tags.forEach(t => { TAG_FAMILY[t] = f.key; CANON[t.toLowerCase()] = t; }));
const label = t => LABEL[t] || t;

/* =====================================================================
   MAP SETTINGS
   ===================================================================== */
const SEED = 20260713;          // fixed, so the map looks the same on every visit until the archive changes
const TOPICS_PER_SQRT = 0.62;   // number of topics = this * sqrt(number of links)
const MIN_TOPIC = 8;            // smaller groups are folded into their nearest topic
const TAG_PULL = 0.55;          // how much shared Pinboard tags pull links together (0 = words only)
const PLAY_WEEKS = 8;           // width of the moving window when playing through time
// words too general to name a topic on their own (they can still be part of a pair, as in "world model")
const VAGUE = new Set('model models technology tech real actually personal university company companies think next human humans work world data system systems tool tools future power'.split(' '));

/* =====================================================================
   Helpers
   ===================================================================== */
const STOP = new Set(('a about above after again against all also am an and any are as at be because been before being below between both but by can could did do does doing down during each few for from further had has have having he her here hers him his how i if in into is it its itself just me more most my no nor not now of off on once only or other our ours out over own same she should so some such than that the their them then there these they this those through to too under until up very was we were what when where which while who whom why will with would you your yours new news via one two three first using used use make makes made like get gets got may might many much well way ways says said say according year years today week time let lets per within without across around dont cant isnt amp nbsp www http https com org html youtube video watch post thread show shows see read inc ltd even still yet onto upon really based introducing introduces introduce announcing launch launches launched latest every take takes big help helps need needs want wants including include includes thing things part look looks people paper study research researchers ai artificial intelligence january february march april june july august september october november december jan feb mar apr jun jul aug sep sept oct nov dec monday tuesday wednesday thursday friday saturday sunday tldr abstract arxiv nature guardian york times phys reuters bloomberg techcrunch verge wired journal published communications exclusive authors article').split(/\s+/));

const CASE = new Map(); // lowercase word -> Map(spelling as written -> count), to show labels as people write them
function tokenize(s) {
  const out = [];
  const re = /[A-Za-z][A-Za-z0-9'’-]*[A-Za-z0-9]|[A-Za-z]/g;
  let m;
  while ((m = re.exec(s))) {
    const raw = m[0].replace(/[’']s$/i, '').replace(/[’']/g, '');
    const w = raw.toLowerCase();
    if (w.length < 3 || STOP.has(w)) { out.push(null); continue; } // nulls keep positions so pairs don't jump over stopwords
    out.push(w);
    let c = CASE.get(w); if (!c) CASE.set(w, c = new Map());
    c.set(raw, (c.get(raw) || 0) + 1);
  }
  return out;
}
function shown(w) {
  const c = CASE.get(w); if (!c) return w;
  let best = w, bn = 0, total = 0;
  for (const [f, n] of c) { total += n; if (n > bn) { bn = n; best = f; } }
  // A word that is mostly capitalised only because it starts titles is shown in lowercase.
  if (/^[A-Z][a-z]+$/.test(best) && (c.get(w) || 0) >= total * 0.25) return w;
  return best;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeHref = u => /^https?:\/\//i.test(u) ? u : '#';
function domainOf(u) { const m = /^https?:\/\/([^\/?#]+)/i.exec(u || ''); return m ? m[1].replace(/^www\./, '').toLowerCase() : ''; }
const fmtN = n => n.toLocaleString('en-GB');
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = d => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtShort = d => `${d.getDate()} ${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Posts from X arrive with the whole post as their title: show the author and the first sentence.
function shortTitle(title) {
  let t = title, who = '';
  const m = /^(.{1,48}?) on X: ["“”]?([\s\S]*)$/.exec(t);
  if (m) { who = m[1]; t = m[2].replace(/["“”]\s*$/, ''); }
  if (t.length > 120) {
    const cut = t.slice(0, 120);
    const p = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('? '), cut.lastIndexOf('! '));
    t = p > 40 ? cut.slice(0, p + 1) : cut.replace(/\s+\S*$/, '') + '…';
  }
  return { who, t: t || title };
}

/* =====================================================================
   State
   ===================================================================== */
let E = [], BYID = new Map(), N = 0, WEEKS = [];
const DF = new Map();     // term -> number of entries containing it (single words and pairs)
const POST = new Map();   // word -> [entryIndex, weight, ...] for "related" lookups
let T = [];               // topics
let X, Y, TOPIC, FAM, ST; // per entry: position, topic index, family index, display state (0 out, 1 outside chosen topic, 2 in)
let SEEN = new Set();
const S = { q: '', fam: '', w0: null, w1: null, topic: null, sel: null };
let ftIds = null;         // ids from the server's full-text search, or null
let LIST = [];            // entries currently listed in the panel
let REL = [];             // entries related to the open one (drawn as lines)

/* =====================================================================
   Load + index
   ===================================================================== */
function canonTags(raw) {
  const parts = String(raw || '').split(',').map(s => s.trim()).filter(Boolean);
  const out = [], extra = [];
  for (const p of parts) {
    const k = p.toLowerCase();
    if (DROP.has(k)) continue;
    const c = CANON[k] || ALIAS[k];
    if (c) { if (!out.includes(c)) out.push(c); }
    else if (parts.length <= 8 && /^[A-Za-z][\w'’-]{1,24}$/.test(p)) extra.push(p);
  }
  return { tags: out, extra };
}
// Tags missing from the mapping go to an "Unsorted" family; spellings differing only in case are merged.
function addUnsorted() {
  const n = new Map(), spell = new Map();
  for (const e of E) for (const t of e.extra) {
    const k = t.toLowerCase();
    n.set(k, (n.get(k) || 0) + 1);

  const best = new Map();
  for (const [k, sp] of spell) best.set(k, Array.from(sp).sort((a, b) => b[1] - a[1])[0][0]);

  for (const e of E) {
    for (const t of e.extra) { const c = best.get(t.toLowerCase()); if (!e.tags.includes(c)) e.tags.push(c); }
    delete e.extra;
    if (!e.tags.length) { e.tags.push(NOCAT); none++; }

  const order = Array.from(n).sort((a, b) => b[1] - a[1]).map(([k]) => best.get(k));
  if (none) order.push(NOCAT);
  UNSORTED.tags = order;
  if (order.length) FAMILIES.push(UNSORTED);
  order.forEach(t => { TAG_FAMILY[t] = UNSORTED.key; });
}

function build(data) {
  let minT = Infinity, maxT = -Infinity;
  E = (data.entries || []).map((r, i) => {
    const [id, unix, title, summary, link, rawTags] = r;
    const d = new Date(unix * 1000);
    const { tags, extra } = canonTags(rawTags);
    minT = Math.min(minT, d.getTime()); maxT = Math.max(maxT, d.getTime());
    const st = shortTitle(title || '(untitled)');
    return { i, id, d, title: title || '(untitled)', who: st.who, st: st.t, summary: summary || '', link, tags, extra,
             dom: domainOf(link), hay: ((title || '') + ' ' + (summary || '')).toLowerCase() };
  });
  N = E.length;
  BYID = new Map(E.map(e => [e.id, e]));
  addUnsorted();

  // dot colour: the family of the entry's rarest tag (the most specific thing said about it)
  const tagN = new Map();
  for (const e of E) for (const t of e.tags) tagN.set(t, (tagN.get(t) || 0) + 1);
  const famIndex = {}; FAMILIES.forEach((f, k) => { famIndex[f.key] = k; });
  FAM = new Uint8Array(N);
  for (const e of E) {
    let best = e.tags[0];
    for (const t of e.tags) if (tagN.get(t) < tagN.get(best)) best = t;
    FAM[e.i] = famIndex[TAG_FAMILY[best]] ?? famIndex.other ?? 0;
  }

  // weeks
  const first = mondayOf(new Date(minT)), last = mondayOf(new Date(maxT));
  for (let w = new Date(first); w <= last; w.setDate(w.getDate() + 7)) WEEKS.push(new Date(w));
  const firstMs = first.getTime();
  for (const e of E) e.w = clamp(Math.round((mondayOf(e.d).getTime() - firstMs) / 6048e5), 0, WEEKS.length - 1);

  // words: title words count double; pairs of adjacent words are kept for naming topics
  for (const e of E) {
    // the name of whoever posted on X is not what the post is about
    const tt = tokenize(e.title.replace(/^.{1,48}? on X: /, '')), ss = tokenize(e.summary.replace(/^.{1,48}? on X: /, ''));
    const src = new Set(e.dom.split('.').slice(0, -1).flatMap(p => [p, p.replace(/^the/, '')]));
    for (const seq of [tt, ss]) for (let k = 0; k < seq.length; k++) if (seq[k] && src.has(seq[k])) seq[k] = null; // the source's own name says nothing about the topic
    const tf = new Map();
    tt.forEach(w => { if (w) tf.set(w, (tf.get(w) || 0) + 2); });
    ss.forEach(w => { if (w) tf.set(w, (tf.get(w) || 0) + 1); });
    const pairs = new Set();
    for (const seq of [tt, ss]) for (let k = 0; k + 1 < seq.length; k++) if (seq[k] && seq[k + 1] && seq[k] !== seq[k + 1]) pairs.add(seq[k] + ' ' + seq[k + 1]);
    e.tf = tf; e.pairs = Array.from(pairs);
    for (const w of tf.keys()) DF.set(w, (DF.get(w) || 0) + 1);
    for (const p of e.pairs) DF.set(p, (DF.get(p) || 0) + 1);
  }
  // tf-idf vectors, unit length
  for (const e of E) {
    let norm = 0; const vec = [];
    for (const [w, c] of e.tf) {
      const df = DF.get(w);
      if (df < 2 || df > N * 0.25) continue;
      const wt = (1 + Math.log(c)) * Math.log(N / df);
      vec.push([w, wt]); norm += wt * wt;
    }
    norm = Math.sqrt(norm) || 1;
    e.vec = vec.map(([w, wt]) => [w, wt / norm]);
    for (const [w, wt] of e.vec) { let p = POST.get(w); if (!p) POST.set(w, p = []); p.push(e.i, wt); }
    delete e.tf;
  }
  const a = new Date(minT), b = new Date(maxT);
  $('sub').textContent = `${fmtN(N)} links, ${MONTHS[a.getMonth()]} ${a.getFullYear()} to ${fmtDate(b)}`;
}

/* =====================================================================
   Topics: group entries by shared vocabulary (spherical k-means), then
   lay the groups out so that similar groups are neighbours.
   ===================================================================== */
function findTopics() {
  const rand = rng(SEED);

  const VOC = new Map(), WORDS = [];
  const idx = w => { let k = VOC.get(w); if (k === undefined) { k = WORDS.length; VOC.set(w, k); WORDS.push(w); } return k; };
  const DI = new Array(N), DW = new Array(N);
  for (const e of E) {
    const ii = [], ww = []; let norm = 0;
    for (const [w, wt] of e.vec) if (DF.get(w) >= 3) { ii.push(idx(w)); ww.push(wt); norm += wt * wt; }
    norm = Math.sqrt(norm);
    if (norm) for (let k = 0; k < ww.length; k++) ww[k] /= norm;

  for (const t of T) {
    t.members.sort((a, b) => own[b] - own[a]);
    t.rep = E[t.members[0]].id;
    t.fam = famCount[t.k].indexOf(Math.max(...famCount[t.k]));
    const inDF = new Map();
    for (const i of t.members) {
      for (const [w] of E[i].vec) inDF.set(w, (inDF.get(w) || 0) + 1);
      for (const p of E[i].pairs) inDF.set(p, (inDF.get(p) || 0) + 1);
    }
    const cands = [];
    for (const [w, n] of inDF) {
      const pair = w.includes(' ');
      if (!pair && VAGUE.has(w)) continue;

      cands.push([w, pin * Math.log((pin + 1e-4) / (pout + 1e-4)) * (pair ? 1.25 : 1)]);
    }
    cands.sort((a, b) => b[1] - a[1]);
    const stem = w => w.slice(0, 5);
    const free = w => !NAMES.has(w.split(' ').map(stem).join(' '));
    let pickN = cands.findIndex(c => free(c[0]));
    if (pickN >= 0 && !cands[pickN][0].includes(' ')) { // prefer "claude code" to "claude" when both describe the topic
      const top = cands[pickN];
      const p = cands.findIndex((c, k) => k > pickN && k < pickN + 5 && c[0].includes(' ') && c[0].split(' ').includes(top[0]) && c[1] >= top[1] * 0.55 && free(c[0]));
      if (p >= 0) pickN = p;
    }
    const used = new Set();
    let name;
    if (pickN >= 0) {
      const w = cands[pickN][0];
      NAMES.add(w.split(' ').map(stem).join(' '));
      name = w.split(' ').map(shown).join(' '); w.split(' ').forEach(x => used.add(stem(x)));
    } else name = label(E[t.members[0]].tags[0]);
    const also = [];
    for (const [w] of cands) {
      if (also.length === 3) break;
      const parts = w.split(' ');
      if (parts.some(x => used.has(stem(x)))) continue;

    }

  // on the side facing the topic they are next closest to

  const m0 = WEEKS[0].getFullYear() * 12 + WEEKS[0].getMonth();
  const last = WEEKS[WEEKS.length - 1], nm = last.getFullYear() * 12 + last.getMonth() - m0 + 1;
  for (const t of T) {
    t.months = new Array(nm).fill(0);
    for (const i of t.members) { const d = E[i].d; t.months[clamp(d.getFullYear() * 12 + d.getMonth() - m0, 0, nm - 1)]++; }
  }
}

    `<dt><kbd>o</kbd></dt><dd>Open the article</dd><dt><kbd>Esc</kbd></dt><dd>Step back</dd></dl>` +
    `<p class="foot">Links saved to Pinboard by David Jhave Johnston, passed through IFTTT and Google Sheets into a SQLite archive. Postdoctoral research, Center for Digital Narrative, University of Bergen. The topics are computed in your browser from titles and summaries and are redrawn when the archive grows. <a href="https://glia.ca/">glia.ca</a></p>`;
}

function related(e, k) {
  const acc = new Float32Array(N);
  for (const [w, wt] of e.vec) { const p = POST.get(w); if (!p) continue; for (let j = 0; j < p.length; j += 2) acc[p[j]] += wt * p[j + 1]; }
  const tagSet = new Set(e.tags), cand = [];
  for (let i = 0; i < N; i++) {
    if (acc[i] < 0.06 || i === e.i) continue;
    const o = E[i]; if (o.link === e.link || o.title === e.title) continue;
    let shared = 0; for (const t of o.tags) if (tagSet.has(t)) shared++;
    const union = tagSet.size + o.tags.length - shared;
    cand.push([i, acc[i] + (union ? 0.08 * shared / union : 0)]);
  }
  cand.sort((a, b) => b[1] - a[1]);
  return cand.slice(0, k).map(([i]) => E[i]);
}
const textCache = new Map();
function paragraphs(text) {
  const ps = text.split(/\n\s*\n|\n~\n/).map(s => s.replace(/\s*\n\s*/g, ' ').trim()).filter(s => s && s !== '~');
  return ps.map((p, k) => `<p class="${k === 0 ? 'lede' : ''}${p.length < 70 ? ' short' : ''}">${esc(p)}</p>`).join('');
}
function renderReader(p) {
  const e = BYID.get(S.sel), t = T[TOPIC[e.i]];
  const backTo = S.topic !== null ? esc(T[S.topic].name) : S.q ? 'search results' : 'all topics';
  const far = REL.filter(o => TOPIC[o.i] !== TOPIC[e.i]).length;
  p.innerHTML =
    `<button class="back" type="button" data-close>← Back to ${backTo}</button>` +
    `<p class="kicker" style="margin-top:12px"><span>${fmtDate(e.d)}</span><span>${esc(e.dom)}</span></p>` +
    `<h2>${e.who ? esc(e.who) + ': ' : ''}${esc(e.st)}</h2>` +
    `<div class="chips"><button class="chip" data-topic="${t.k}" title="Show this topic"><i style="background:var(--${FAMILIES[t.fam].key})"></i>${esc(t.name)}</button>` +
      e.tags.map(g => `<span class="chip" style="background:none"><i style="background:var(--${TAG_FAMILY[g] || 'other'})"></i>${esc(label(g))}</span>`).join('') + `</div>` +
    `<a class="open" href="${esc(safeHref(e.link))}" target="_blank" rel="noopener noreferrer" data-visit>Open the article</a>` +
    `<div class="body" id="rbody">${e.summary ? `<p class="lede">${esc(e.summary)}</p>` : ''}</div>` +
    (REL.length ? `<h3>Closest links${far ? `, ${far} of them in other topics` : ''}</h3><ul class="rows">${REL.map(o =>
      `<li><button type="button" data-id="${o.id}"><span class="d">${fmtShort(o.d)}</span><span class="t">${o.who ? `<b>${esc(o.who)}</b>` : ''}${esc(o.st)}</span>` +
      `<span class="m">${esc(T[TOPIC[o.i]].name)} · ${esc(o.dom)}</span></button></li>`).join('')}</ul>` : '');
  p.scrollTop = 0;
  loadText(e);
}
async function loadText(e) {
  let text = textCache.get(e.id);
  if (text === undefined) {
    try { const r = await fetch(`atlas.php?id=${e.id}`); if (!r.ok) throw new Error(r.status); text = (await r.json()).text || ''; }
    catch (err) { text = null; }
    textCache.set(e.id, text);
  }
  if (S.sel !== e.id) return;
  const body = $('rbody'); if (!body) return;
  if (text === null) { body.insertAdjacentHTML('beforeend', '<p class="note">The full text could not be loaded. Open the article instead.</p>'); return; }
  if (!text) return;
  body.innerHTML = paragraphs(text);
  if (text.length > 2600) { body.classList.add('clip'); body.insertAdjacentHTML('afterend', '<button class="linkbtn" id="morebtn" type="button">Show the full saved text</button>'); }
}
function openEntry(id, quiet) {
  const e = BYID.get(id); if (!e) return;
  stopPlay();
  S.sel = id; REL = related(e, 8);
  if (!ST[e.i]) { S.w0 = S.w1 = null; S.fam = ''; if (S.topic !== null && TOPIC[e.i] !== S.topic) S.topic = null; }
  applyFilters();
  if (!quiet) reveal(e.i);
  if (innerWidth <= 900) $('panel').scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' });
}
function closeEntry() { S.sel = null; REL = []; applyFilters(); }
function markSeen(e) {
  if (!e || SEEN.has(e.link)) return;
  SEEN.add(e.link);
  try { localStorage.setItem('visitedLinks', JSON.stringify(Array.from(SEEN))); } catch (err) {}
}
function clearFilter(what) {
  if (what === 'topic' || what === 'all') S.topic = null;
  if (what === 'q' || what === 'all') { S.q = ''; $('q').value = ''; ftIds = null; }
  if (what === 'fam' || what === 'all') S.fam = '';
  if (what === 'time' || what === 'all') { stopPlay(); S.w0 = S.w1 = null; }
  applyFilters();
  if (what === 'all' || what === 'topic') flyTo(fitView());
}
$('panel').addEventListener('click', ev => {
  const b = ev.target.closest('button, a'); if (!b) return;
  if (b.id === 'morebtn') { $('rbody').classList.remove('clip'); b.remove(); }
  else if (b.id === 'more') { shownRows += CHUNK; $('rows').innerHTML = rowsHTML(LIST.slice(0, shownRows)); if (LIST.length <= shownRows) b.remove(); }
  else if (b.dataset.close !== undefined) closeEntry();
  else if (b.dataset.visit !== undefined) markSeen(BYID.get(S.sel));
  else if (b.dataset.clear) clearFilter(b.dataset.clear);
  else if (b.dataset.topic) setTopic(+b.dataset.topic);
  else if (b.dataset.id) openEntry(+b.dataset.id);
});
// pointing at a row or a topic in the panel marks it on the map
$('panel').addEventListener('pointerover', ev => {
  if (ev.pointerType !== 'mouse') return;
  const b = ev.target.closest('button[data-id], button[data-topic]');
  let d = -1, t = -1;
  if (b && b.dataset.id) { const e = BYID.get(+b.dataset.id); if (e) d = e.i; } else if (b) t = +b.dataset.topic;
  if (d !== hoverDot || t !== hoverTopic) { hoverDot = d; hoverTopic = t; $('tip').hidden = true; requestDraw(); }
});
$('panel').addEventListener('pointerleave', () => { if (hoverDot >= 0 || hoverTopic >= 0) { hoverDot = hoverTopic = -1; requestDraw(); } });

/* =====================================================================
   Search, theme, keys, address
   ===================================================================== */
let qTimer = 0, qSeq = 0;
function setQuery(v) {
  S.q = v.trim(); ftIds = null; S.sel = null; REL = [];
  applyFilters();
  clearTimeout(qTimer);
  if (S.q.length < 3) return;
  const mine = ++qSeq;
  qTimer = setTimeout(async () => {
    try {
      const r = await fetch(`atlas.php?q=${encodeURIComponent(S.q)}`); if (!r.ok) return;
      const j = await r.json(); if (mine !== qSeq) return;
      ftIds = new Set(j.ids || []); applyFilters(S.sel !== null);
    } catch (err) { /* title and summary search still works */ }
  }, 350);
}
$('q').addEventListener('input', ev => { const v = ev.target.value; clearTimeout(setQuery.t); setQuery.t = setTimeout(() => setQuery(v), 160); });

const SUN = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></g></svg>';
const MOON = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M16.8 12.9A7 7 0 0 1 7.1 3.2a7.2 7.2 0 1 0 9.7 9.7z"/></svg>';
function syncTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark', b = $('theme');
  b.innerHTML = (dark ? SUN : MOON) + `<span style="margin-left:6px">${dark ? 'Light' : 'Dark'}</span>`;
  b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  readColours(); requestDraw();
}
$('theme').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  syncTheme();
});

document.addEventListener('keydown', ev => {
  const inField = ev.target.matches('input, textarea, select');
  if (ev.key === '/' && !inField) { ev.preventDefault(); $('q').focus(); $('q').select(); return; }
  if (ev.key === 'Escape') {
    if (inField) { ev.target.blur(); return; }
    if (S.sel !== null) closeEntry();
    else if (S.topic !== null) clearFilter('topic');
    else clearFilter('all');
    return;
  }
  if (inField || ev.metaKey || ev.ctrlKey || ev.altKey || !N) return;
  if (['j', 'k', 'o'].includes(ev.key)) ev.preventDefault();
  if (ev.key === 'j' || ev.key === 'k') {
    if (!LIST.length) return;
    let n = LIST.findIndex(e => e.id === S.sel);
    n = n < 0 ? 0 : clamp(n + (ev.key === 'j' ? 1 : -1), 0, LIST.length - 1);
    openEntry(LIST[n].id);
  } else if (ev.key === 'o' && S.sel !== null) {
    const e = BYID.get(S.sel); markSeen(e); window.open(safeHref(e.link), '_blank', 'noopener');
  }
});

// The address keeps the view shareable. A topic is written as the id of its most typical
// link, so the address still works after the archive grows and the topics are recomputed.
function writeHash() {
  const p = new URLSearchParams();
  if (S.q) p.set('q', S.q);
  if (S.topic !== null) p.set('topic', T[S.topic].rep);
  if (S.fam) p.set('family', S.fam);
  if (S.w0 !== null) { p.set('from', isoDay(WEEKS[S.w0])); p.set('to', isoDay(WEEKS[S.w1])); }
  if (S.sel !== null) p.set('entry', S.sel);
  const h = p.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  S.q = p.get('q') || ''; $('q').value = S.q; ftIds = null;
  const rep = BYID.get(+p.get('topic')); S.topic = rep ? TOPIC[rep.i] : null;
  S.fam = FAMILIES.some(f => f.key === p.get('family')) ? p.get('family') : '';
  S.w0 = S.w1 = null;
  const f = p.get('from'), t = p.get('to');
  if (f && t) { const wi = s => WEEKS.findIndex(d => isoDay(d) === s), a = wi(f), b = wi(t); if (a >= 0 && b >= 0) { S.w0 = Math.min(a, b); S.w1 = Math.max(a, b); } }
  const e = +p.get('entry'); return BYID.has(e) ? e : null;
}
function applyHash() {
  const entry = readHash(); S.sel = null; REL = [];
  applyFilters();
  if (S.q.length >= 3) { const q = S.q, sel = entry; setQuery(q); if (sel !== null) openEntry(sel, true); }
  else if (entry !== null) openEntry(entry, true);
  if (entry !== null) { const i = BYID.get(entry).i, k = Math.max(fitK, Math.min(fitK * 2.2, 9)); Object.assign(view, { k, x: cw / 2 - X[i] * k, y: ch / 2 - Y[i] * k }); }
  else if (S.topic !== null) { const t = T[S.topic], k = clamp(Math.min(cw, ch) * 0.36 / t.r, fitK, 16); Object.assign(view, { k, x: cw / 2 - t.x * k, y: ch / 2 - t.y * k }); }
  requestDraw();
}
addEventListener('hashchange', () => { if (N) applyHash(); });
new ResizeObserver(() => { resize(); if (WEEKS.length) renderTime(); }).observe($('mapwrap'));

/* =====================================================================
   Start
   ===================================================================== */
(async function main() {
  syncTheme();
  try { SEEN = new Set(JSON.parse(localStorage.getItem('visitedLinks') || '[]')); } catch (e) {}
  let data;
  try {
    const r = await fetch('atlas.php');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (err) {
    $('status').textContent = `The archive could not be loaded (${err.message}). Check that atlas.php and ai_updates.sqlite are in the same folder as this page.`;
    $('sub').textContent = 'Archive unavailable';
    return;
  }
  if (!(data.entries || []).length) { $('status').textContent = 'The archive is empty.'; return; }
  $('status').textContent = 'Drawing the map…';
  await new Promise(r => setTimeout(r, 30)); // let the message paint before the heavy step
  build(data);
  findTopics();
  ST = new Uint8Array(N).fill(2);
  WK_TOT = new Array(WEEKS.length).fill(0); for (const e of E) WK_TOT[e.w]++;
  readColours(); indexDots();
  $('status').hidden = true;
  resize();
  applyHash();
})();
</script>
